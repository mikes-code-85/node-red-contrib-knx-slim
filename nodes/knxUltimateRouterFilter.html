<script type="text/javascript" src="resources/node-red-contrib-knx-slim/htmlUtils.js"></script>

<script type="text/javascript">
    RED.nodes.registerType('knxSlimRouterFilter', {
        category: "KNX Slim Router",
        color: 'lightblue',
        defaults: {
            name: { value: "KNX Router Filter", required: false },
            allowWrite: { value: true },
            allowResponse: { value: true },
            allowRead: { value: true },
            gaMode: { value: "off" },
            gaPatterns: { value: "" },
            srcMode: { value: "off" },
            srcPatterns: { value: "" },
            rewriteGA: { value: false },
            gaRewriteRules: { value: "" },
            rewriteSource: { value: false },
            srcRewriteRules: { value: "" }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: function (i) {
            if (i === 0) return RED._('knxSlimRouterFilter.outputs.passed');
            return RED._('knxSlimRouterFilter.outputs.dropped');
        },
        icon: "node-knx-icon.svg",
        label: function () {
            return (this.name || "KNX Router Filter");
        },
        paletteLabel: "KNX Router Filter",
        oneditprepare: function () {
            try { RED.sidebar.show("help"); } catch (error) { }

            const toggleRewrite = () => {
                if ($("#node-input-rewriteGA").is(":checked")) {
                    $("#knx-router-filter-ga-rewrite-row").show();
                } else {
                    $("#knx-router-filter-ga-rewrite-row").hide();
                }
                if ($("#node-input-rewriteSource").is(":checked")) {
                    $("#knx-router-filter-src-rewrite-row").show();
                } else {
                    $("#knx-router-filter-src-rewrite-row").hide();
                }
            };
            $("#node-input-rewriteGA").on("change", toggleRewrite);
            $("#node-input-rewriteSource").on("change", toggleRewrite);
            toggleRewrite();
        },
        oneditsave: function () {
            try { RED.sidebar.show("info"); } catch (error) { }
        },
        oneditcancel: function () {
            try { RED.sidebar.show("info"); } catch (error) { }
        }
    })
</script>

<script type="text/html" data-template-name="knxSlimRouterFilter">

  </div>
    <div class="form-row">

    <div class="form-row">

            <option value="block" data-i18n="knxSlimRouterFilter.selectlists.mode.block"></option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-gaPatterns"><i class="fa fa-filter"></i> <span data-i18n="knxSlimRouterFilter.properties.gaPatterns"></span></label>

    <div class="form-row">

        <select style="width:calc(100% - 130px)" id="node-input-srcMode">
            <option value="off" data-i18n="knxSlimRouterFilter.selectlists.mode.off"></option>
            <option value="allow" data-i18n="knxSlimRouterFilter.selectlists.mode.allow"></option>
            <option value="block" data-i18n="knxSlimRouterFilter.selectlists.mode.block"></option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-srcPatterns"><i class="fa fa-filter"></i> <span data-i18n="knxSlimRouterFilter.properties.srcPatterns"></span></label>
        <textarea style="width:100%; height:80px;" id="node-input-srcPatterns" data-i18n="[placeholder]knxSlimRouterFilter.placeholder.srcPatterns"></textarea>
    </div>
    <div class="form-row">
        <input type="checkbox" id="node-input-rewriteSource" style="display:inline-block; width:auto; vertical-align:top;">
        <label style="width:auto" for="node-input-rewriteSource">&nbsp;&nbsp;<span data-i18n="knxSlimRouterFilter.properties.rewriteSource"></span></label>
    </div>
    <div class="form-row" id="knx-router-filter-src-rewrite-row">
        <label for="node-input-srcRewriteRules"><i class="fa fa-random"></i> <span data-i18n="knxSlimRouterFilter.properties.srcRewriteRules"></span></label>
        <textarea style="width:100%; height:90px;" id="node-input-srcRewriteRules" data-i18n="[placeholder]knxSlimRouterFilter.placeholder.srcRewriteRules"></textarea>
    </div>
</script>
